<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
  <title id="title">LeadPilot: Anwendung und getrennte Datenquellen</title>
  <desc id="desc">React, TypeScript und Vite bilden die Oberfläche. Datenadapter verbinden sie mit Supabase. Historische Ausgangsdaten, Simulation und Live-Kennzahlen werden getrennt behandelt. Ein HubSpot-Import ist eingefroren; ein separater n8n-Ingest ist im Quellprojekt vorhanden.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52647b"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#25354b}.heading{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#54657c}.line{fill:none;stroke:#52647b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="1120" height="740" rx="14" fill="#fff"/>
  <text x="32" y="45" class="heading">LeadPilot · Anwendung &amp; Datenquellen</text>
  <text x="32" y="74" class="body">Architektur des fiktiven Unternehmens- und Entwicklungsprojekts</text>
  <rect x="32" y="117" width="300" height="182" rx="12" fill="#faf1ff" stroke="#bf8ed4"/>
  <text x="54" y="153" class="label">Web-App</text>
  <text x="54" y="188" class="body">React · TypeScript · Vite</text>
  <text x="54" y="222" class="body">Dashboard, Kontakte, Firmen, Deals</text>
  <text x="54" y="261" class="small">Ansichten, Suche und Filter</text>
  <rect x="410" y="117" width="300" height="182" rx="12" fill="#eefaf7" stroke="#73b8a5"/>
  <text x="432" y="153" class="label">Zugriff &amp; Datenadapter</text>
  <text x="432" y="188" class="body">Anmeldung über Supabase Auth</text>
  <text x="432" y="222" class="body">Quellen und Datenstatus ausweisen</text>
  <text x="432" y="261" class="small">Zugriff mit angemeldeter Sitzung</text>
  <rect x="788" y="117" width="300" height="182" rx="12" fill="#fff6ea" stroke="#d9a15b"/>
  <text x="810" y="153" class="label">Supabase</text>
  <text x="810" y="188" class="body">PostgreSQL · CRM-Datensätze</text>
  <text x="810" y="222" class="body">Mandanten und Rollen per RLS</text>
  <text x="810" y="261" class="small">Aufnahmen: synthetische Seed-Daten</text>
  <path d="M337 208H405" class="line" marker-start="url(#arrow)"/>
  <path d="M715 208H783" class="line" marker-start="url(#arrow)"/>
  <text x="32" y="365" class="label">Drei getrennte Datenbereiche</text>
  <text x="32" y="392" class="small">Herkunft und Status bleiben getrennt nachvollziehbar.</text>
  <rect x="32" y="438" width="324" height="156" rx="12" fill="#f2f5fc" stroke="#8da4cd"/>
  <text x="54" y="473" class="label">Historische Daten &amp; Import</text>
  <text x="54" y="508" class="body">Ausgangswerte des fiktiven Projekts</text>
  <text x="54" y="540" class="body">Eingefrorener HubSpot-Import</text>
  <text x="54" y="571" class="small">Keine laufende HubSpot-Synchronisierung</text>
  <rect x="398" y="438" width="324" height="156" rx="12" fill="#faf1ff" stroke="#bf8ed4"/>
  <text x="420" y="473" class="label">Simulation</text>
  <text x="420" y="508" class="body">Eigener, reproduzierbarer Zustand</text>
  <text x="420" y="540" class="body">Historische Daten bleiben getrennt</text>
  <text x="420" y="571" class="small">Regelbasiert · kein KI-Mechanismus</text>
  <rect x="764" y="438" width="324" height="156" rx="12" fill="#eefaf7" stroke="#73b8a5"/>
  <text x="786" y="473" class="label">Live-Kennzahlen</text>
  <text x="786" y="508" class="body">Separater n8n-Ingest vorhanden</text>
  <text x="786" y="540" class="body">Quellstatus und Definition sichtbar</text>
  <text x="786" y="571" class="small">Vorhandener Code ≠ aktueller Live-Test</text>
  <path d="M194 438V415H560V304M926 438V415H560M560 438V415" fill="none" stroke="#52647b" stroke-width="2"/>
  <path d="M560 340V304" class="line"/>
  <rect x="32" y="636" width="1056" height="76" rx="9" fill="#f4f6f9"/>
  <text x="54" y="667" class="body">Beleggrenze: keine nachgewiesene automatische Next-Best-Action-Engine.</text>
  <text x="54" y="692" class="small">Die zusätzlichen Routing- und KI-Demos sind eigenständige Portfolio-Projekte.</text>
</svg>
