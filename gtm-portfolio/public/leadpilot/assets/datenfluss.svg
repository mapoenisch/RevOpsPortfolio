<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Datenfluss im LeadPilot Dashboard-CRM</title><desc id="d">Drei Wege: n8n erzeugt versionierte Baseline-Dateien offline, die App simuliert und speichert Läufe in Supabase, und eine signierte Live-KPI-Strecke schreibt über n8n in Supabase.</desc>
